name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # The workbench ships inside Heliograph.Workbench as static web assets, so it is built first. Without it the
      # package would be empty; the check after Pack catches that.
      - name: Build the workbench client
        working-directory: src/Heliograph.Workbench.Client
        run: npm ci && npm run build
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Heliograph.slnx
      - name: Build
        run: dotnet build Heliograph.slnx -c Release --no-restore
      # The editor round-trip tests open and save each benchmark letter in a real LibreOffice, and the PDF tests
      # convert with it. The PDF tests also run veraPDF in Docker, which the runner already has.
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
      # The PDF tests compare Heliograph's converter with LibreOffice, so LibreOffice is given the very font files
      # Heliograph.Pdf ships (Liberation, Carlito, Caladea), not whatever versions the runner has or lacks.
      - name: Give LibreOffice the fonts Heliograph.Pdf ships
        run: mkdir -p ~/.local/share/fonts && cp src/Heliograph.Pdf/Fonts/BuiltIn/*.ttf ~/.local/share/fonts/ && fc-cache -f
      - name: Test
        env:
          HELIOGRAPH_REQUIRE_EDITOR: "1"
        run: dotnet test Heliograph.slnx -c Release --no-build
      # Proves the packages can be built, so a release never finds out first.
      - name: Pack
        run: dotnet pack Heliograph.slnx -c Release --no-build -o artifacts
      - name: The workbench is inside its package
        run: unzip -l artifacts/Heliograph.Workbench.*.nupkg | grep -q 'staticwebassets/heliograph-workbench.js'
      - name: Size budgets
        run: node scripts/check-policies.mjs
      - name: Doc links
        run: node scripts/check-doc-links.mjs

  # One aggregate check, so the ruleset names "all" instead of every job.
  all:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    permissions: {}
    steps:
      - name: Decide whether checks have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Some checks failed: $RESULTS"
              exit 1
            fi
          done
          echo "All checks passed"
