name: Package Release

# Publishes every package in this repo to nuget.org at one version, on a version tag. A tag with a
# hyphen (v0.1.0-alpha.1) is a prerelease.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # NuGet Trusted Publishing (OIDC token exchange)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A mismatch would try to push a version that is already published.
      - name: Verify every package version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          for PROJECT in src/*/*.csproj; do
            VERSION=$(grep -oE '<Version>[^<]+</Version>' "$PROJECT" | head -1 | sed -E 's#</?Version>##g')
            echo "$PROJECT version: $VERSION"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag ${TAG} does not match $PROJECT <Version>${VERSION}</Version>. Every package is released at one version."
              exit 1
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Heliograph.slnx

      - name: Build
        run: dotnet build Heliograph.slnx -c Release --no-restore

      # The same proof as ci.yml: nothing is published that has not passed with a real editor.
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Test
        env:
          HELIOGRAPH_REQUIRE_EDITOR: "1"
        run: dotnet test Heliograph.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Heliograph.slnx -c Release --no-build -o artifacts

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heliograph-nuget
          path: artifacts/*.nupkg

      # Trusted Publishing: this run's GitHub OIDC token is exchanged for a nuget.org API key that
      # expires in an hour. No long-lived secret is stored. It needs a Trusted Publishing policy on
      # nuget.org for this repo and this workflow file (jonnymuir/Heliograph, package-release.yml).
      - name: NuGet login (OIDC -> temp API key)
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

      # Last, so a publish that fails leaves no release behind that points at packages nobody can restore.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) gh release create "$TAG" artifacts/*.nupkg --title "$TAG" --generate-notes --prerelease ;;
            *)   gh release create "$TAG" artifacts/*.nupkg --title "$TAG" --generate-notes ;;
          esac
