version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned only to patch the copy Aspire pulls in (GHSA-qhrr-8q5h-9q3h). Aspire is built against this major, and
      # CI does not run the Aspire host, so a new major is taken by hand with Aspire, not by auto-PR.
      - dependency-name: "MessagePack"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/src/Heliograph.Workbench.Client"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      workbench-client:
        patterns: ["*"]
        update-types: ["minor", "patch"]
